[pytest]
pythonpath = .
# Without this a bare `pytest` also collects archive/, which holds retired
# suites for code that no longer exists (one of them fails on purpose).
testpaths = tests
markers =
    legacy_mix: runs with PLG_LEGACY_MIX=1, the kept earlier FL mixer automation
filterwarnings =
    ignore:'audioop' is deprecated:DeprecationWarning
    ignore:Couldn't find ffmpeg or avconv:RuntimeWarning
    ignore:Couldn't find ffprobe or avprobe:RuntimeWarning
